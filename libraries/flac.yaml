name: flac
source_dir: repositories/flac
languages: [c, cxx]

depends_on:
  - libogg

use_install_prefix_as_find_root: true

cmake_options:
  # Project build policy (AGENTS.md § Build policy): pin the standard, otherwise the build
  # takes the host compiler's default (gnu++17 on gcc 14 today, something else tomorrow) and
  # the archive's API can change with the build machine.
  CMAKE_CXX_STANDARD: 20
  CMAKE_CXX_STANDARD_REQUIRED: true
  BUILD_SHARED_LIBS: false
  BUILD_CXXLIBS: false
  BUILD_PROGRAMS: false
  BUILD_EXAMPLES: false
  BUILD_TESTING: false
  BUILD_DOCS: false
  INSTALL_MANPAGES: false
  INSTALL_PKGCONFIG_MODULES: true
  INSTALL_CMAKE_CONFIG_MODULE: true
  WITH_OGG: true
  WITH_FORTIFY_SOURCE: false
  WITH_STACK_PROTECTOR: false
