name: zstd
source_dir: repositories/zstd/build/cmake
languages: [c, cxx]

cmake_options:
  # Project build policy (AGENTS.md § Build policy): pin the standard, otherwise the build
  # takes the host compiler's default (gnu++17 on gcc 14 today, something else tomorrow) and
  # the archive's API can change with the build machine.
  CMAKE_CXX_STANDARD: 20
  CMAKE_CXX_STANDARD_REQUIRED: true
  ZSTD_LEGACY_SUPPORT: true
  ZSTD_MULTITHREAD_SUPPORT: true
  ZSTD_BUILD_PROGRAMS: false
  ZSTD_BUILD_CONTRIB: false
  ZSTD_BUILD_TESTS: false
  ZSTD_PROGRAMS_LINK_SHARED: false
  # zstd defaults to building both static and shared. We only want static.
  ZSTD_BUILD_STATIC: true
  ZSTD_BUILD_SHARED: false

platforms:
  linux:
    cmake_options:
      ZSTD_USE_STATIC_RUNTIME: false

  macos:
    cmake_options:
      ZSTD_USE_STATIC_RUNTIME: false

  windows:
    cmake_options: {}
    runtime_MT:
      ZSTD_USE_STATIC_RUNTIME: true
    runtime_MD:
      ZSTD_USE_STATIC_RUNTIME: false
