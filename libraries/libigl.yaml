name: libigl
source_dir: repositories/libigl
languages: [cxx]

# Geometry-processing toolbox (mesh queries, discrete operators, remeshing helpers).
# Pinned to the v2.6.0 RELEASE tag (owner rule: no release candidates).
# Header-only upstream by default; built here as a STATIC library so the explicit
# template instantiations are compiled ONCE in this archive instead of in every engine
# translation unit that includes a header.
#
# ⚠️ CONSUMERS MUST DEFINE `IGL_STATIC_LIBRARY`. The static build compiles
# include/igl/*.cpp into libigl.a and the headers then declare (rather than define) the
# instantiated templates — but ONLY when that macro is set. Upstream propagates it as a
# PUBLIC compile definition through the igl::core CMake target; anything linking the raw
# archive (as DependenciesTest does) must set it by hand, or every include pulls the
# implementation back in and the link ends in duplicate symbols.
#
# ⚠️ THE DEBUG ARCHIVE IS ENORMOUS: 2.3 GiB against 22 MiB in Release (Linux, gcc 14.2),
# because 463 Eigen-heavy translation units carry full debug info. It is the largest single
# file of the Debug package — for scale, tinyusdz weighs 947 MiB and SPIRV-Tools-opt 764 MiB
# there — and it grows the Debug lib/ directory from 3.2 to 5.5 GiB. Nothing is wrong; it is
# simply worth knowing before the Debug zip is uploaded. Trimming it would mean lowering the
# debug level for this library alone, which is an owner decision, not a default.
#
# ⚠️ EIGEN IS THE ABI. libigl's API is Eigen matrices, so the archive is only usable with
# the exact Eigen it was compiled against — which is why the build installs those headers
# into `include/Eigen` alongside it. If the engine ever links its own Eigen, the two MUST
# be the same version.
#
# ⚠️ EIGEN IS FETCHED AT CONFIGURE TIME, and deliberately so. Upstream's
# `cmake/recipes/external/eigen.cmake` FetchContent-clones gitlab.com/libeigen/eigen at the
# tag libigl was written against — **3.4.0** for v2.6.0 — which makes libigl the only
# library of the cascade that reaches the network during a build.
#
# This was tried as a submodule (owner decision 2026-08-31, then reverted the same day) and
# the version coupling is why it went back: the Eigen a given libigl needs is NOT the latest
# Eigen. libigl v2.6.0 wants 3.4.0 while upstream Eigen is already on 5.0.x, and nothing
# would verify a local submodule's revision — `FETCHCONTENT_SOURCE_DIR_EIGEN` makes
# FetchContent take the directory as-is, tag or not, so a submodule bumped by routine
# maintenance (or by `check_releases.py` reporting it outdated, which it would) silently
# builds libigl against an Eigen it was never tested with. Letting libigl's own recipe pick
# the version keeps the two in lockstep by construction. The tag is pinned in that recipe,
# so the build stays reproducible; it just needs network access.

# ⚠️ WINDOWS NEEDS /DWIN32 RESTORED BY HAND. libigl gates its Windows paths on the
# old-style `WIN32` macro (Timer.h's <sys/time.h> fallback, plus ~40 `#ifdef WIN32`
# guards around explicit template instantiations in include/igl/*.cpp), which is NOT a
# compiler built-in — MSVC only defines `_WIN32`. `WIN32` normally comes from CMake's
# default MSVC flags (`/DWIN32 /D_WINDOWS`), but the builder overwrites CMAKE_CXX_FLAGS
# wholesale (builder/platforms/windows.py), dropping it for every library. Every other
# library in the cascade tests `_WIN32` and never notices; libigl is the first to care.
# Without it the build dies on Timer.h — and even past that, the WIN32-guarded
# instantiations would be silently missing from the archive (link errors downstream).

cmake_options:
  BUILD_SHARED_LIBS: false
  CMAKE_POSITION_INDEPENDENT_CODE: true
  LIBIGL_USE_STATIC_LIBRARY: true
  LIBIGL_INSTALL: true

  # Project build policy (AGENTS.md § Build policy). libigl only requires a MINIMUM of C++17
  # (target_compile_features cxx_std_17), so the build otherwise lands on the host default
  # rather than on the standard the engine uses.
  CMAKE_CXX_STANDARD: 20
  CMAKE_CXX_STANDARD_REQUIRED: true

  # Consumer only.
  LIBIGL_BUILD_TESTS: false
  LIBIGL_BUILD_TUTORIALS: false
  LIBIGL_GLFW_TESTS: false
  LIBIGL_WARNINGS_AS_ERRORS: false

  # Every optional module is off. They exist to be turned on one at a time, and each one
  # pulls a third-party dependency libigl downloads itself at configure time (embree,
  # glfw, imgui, stb, predicates, spectra, tinyxml2, CGAL/boost, tetgen, triangle...).
  # The engine consumes the core geometry algorithms only.
  # (No LIBIGL_CYCODEBASE here: that module only exists on libigl's main branch, and CMake
  # reports an unknown -D as an unused variable rather than an error — a silent way to
  # believe something is disabled when the project never saw the switch.)
  LIBIGL_EMBREE: false
  LIBIGL_GLFW: false
  LIBIGL_IMGUI: false
  LIBIGL_OPENGL: false
  LIBIGL_STB: false
  LIBIGL_PREDICATES: false
  LIBIGL_SPECTRA: false
  LIBIGL_XML: false

  # Copyleft modules: GPL code and GPL/commercial dependencies (CGAL, CoMISo, TetGen).
  # Off on licensing grounds as much as on build grounds — libigl core itself is MPL2.
  LIBIGL_COPYLEFT_CORE: false
  LIBIGL_COPYLEFT_CGAL: false
  LIBIGL_COPYLEFT_COMISO: false
  LIBIGL_COPYLEFT_TETGEN: false

  # Restricted modules: dependencies under non-commercial or proprietary licenses.
  LIBIGL_RESTRICTED_MATLAB: false
  LIBIGL_RESTRICTED_MOSEK: false
  LIBIGL_RESTRICTED_TRIANGLE: false

platforms:
  windows:
    # See the /DWIN32 warning in the header.
    extra_cxx_flags: "/DWIN32"
