name: tinyusdz
source_dir: repositories/tinyusdz
languages: [c, cxx]

# OpenUSD reader (USDA / USDC crate / USDZ) with no third-party dependency beyond the STL.
#
# ⚠️ PINNED TO v1.0.0-rc3, A RELEASE CANDIDATE — a deliberate exception to the owner rule
# that kept this library on v0.9.4 for exactly that reason. Upstream has cut no final release
# since 0.9.4 (2026-08-31: the tag line runs v0.9.9-rc1..rc7 then v1.0.0-rc1..rc3), so the
# choice is between an RC and a two-major-versions-old reader. Revisit when 1.0.0 final lands.
#
# ⚠️ EXCEPTIONS: the engine cascade is built with -fno-exceptions. Upstream defaults this
# option to Off on POSIX and On for MSVC, whose CMakeLists states "it looks it is hard to
# disable C++ exception for MSVC". It is forced Off here on EVERY platform so nothing depends
# on a per-platform default — the Windows build is where that assumption gets tested.

# ⚠️ DEVIATION from the build policy (AGENTS.md § Build policy) — the C++ standard:
# tinyusdz sets `CMAKE_CXX_STANDARD` unconditionally inside its own branches (17 in the
# configuration used here), so a `-DCMAKE_CXX_STANDARD=20` from the builder is silently
# overridden. The one branch that yields C++20 is gated on TINYUSDZ_WITH_COROUTINE, a
# feature switch, not a standard switch — do not turn a feature on just to move the
# standard. Exceptions are already off (see above), which is the policy point that matters
# most here; RTTI has no upstream switch.

cmake_options:
  BUILD_SHARED_LIBS: false
  TINYUSDZ_BUILD_SHARED_LIBS: false
  CMAKE_POSITION_INDEPENDENT_CODE: true

  TINYUSDZ_CXX_EXCEPTIONS: false

  # ccache would make the generator's output depend on the host's cache state.
  TINYUSDZ_USE_CCACHE: false

  # Upstream builds with -Weverything -Werror on clang, which encodes "compiles warning-free
  # on the exact toolchain upstream tested" — every compiler bump surfaces new -Weverything
  # warnings (upstream already special-cases clang 17 and 18 for that reason). AppleClang 21
  # is the current offender: its libc++ annotates std::mutex for thread-safety analysis, so
  # -Wthread-safety-negative fires all over logger.hh and -Werror turns it fatal. Warnings on
  # this pinned third-party code stay visible in the log; they just no longer fail the build.
  TINYUSDZ_NO_WERROR: true

  # Nothing but the library itself.
  TINYUSDZ_BUILD_TESTS: false
  TINYUSDZ_BUILD_BENCHMARKS: false
  TINYUSDZ_BUILD_EXAMPLES: false
  TINYUSDZ_BUILD_TOOLS: false
  TINYUSDZ_WITH_PYTHON: false
  TINYUSDZ_WITH_C_API: false
  TINYUSDZ_WITH_MCP_SERVER: false

  # The pxr-compatible shim exists to ease porting from OpenUSD; the engine talks to the
  # tinyusdz API directly, so it is dead surface here.
  TINYUSDZ_WITH_PXR_COMPAT_API: false

  # ⚠️ NEW IN v1.0.0-rc3 and ON by default: TINYUSDZ_WITH_TEXTOOLS builds a second static
  # library (tinyusdz_textools — vendored tir/texcomp/texpipe/envmap) and links it into the
  # core for KTX2 / GPU-compressed texture decode inside USDZ. Turned off here for the same
  # reason as the side formats below: the engine owns texture decoding, through libktx for
  # KTX2 and bc7enc_rdo for runtime BC7 (see libraries/ktx.yaml). Leaving it on would also
  # add a second archive to the package and a second entry to every consumer's link line.
  TINYUSDZ_WITH_TEXTOOLS: false

  # Import/export side formats the engine already covers with its own loaders, or does not want.
  TINYUSDZ_WITH_USD_TO_GLTF: false
  TINYUSDZ_WITH_USDOBJ: false
  TINYUSDZ_WITH_USDVOX: false
  TINYUSDZ_WITH_USDFBX: false
  TINYUSDZ_WITH_AUDIO: false

  # MaterialX is off on purpose: the reference asset (Intel Jungle Ruins) uses only
  # UsdPreviewSurface / UsdUVTexture / UsdPrimvarReader_float2 — measured, not assumed.
  # Turn it on the day an asset actually needs it.
  TINYUSDZ_WITH_USDMTLX: false

  # Tydra resolves material bindings and GeomSubsets into a renderer-friendly form. Kept ON:
  # the engine still does its own translation into native scene logic (absorption rule), but
  # re-deriving binding resolution from raw prims would be duplicated work.
  TINYUSDZ_WITH_TYDRA: true

  TINYUSDZ_WITH_MODULE_USDA_READER: true
  TINYUSDZ_WITH_MODULE_USDC_READER: true

# Windows note: turning exceptions off above is what makes expected-lite pull <windows.h>
# in on MSVC, whose min/max macros then break every std::numeric_limits<T>::max() in the
# codebase. Fixed in patches/tinyusdz.patch (NOMINMAX guard in src/nonstd/expected.hpp),
# not here — the header is installed, so consumers hit the same include from their own
# -fno-exceptions translation units and need the guard to travel with it.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# THE COMPOSITION AND MATERIAL PATCHES ARE GONE (re-verified 2026-08-31 against v1.0.0-rc3)
#
# From 2026-08-10 to the v1.0.0-rc3 bump, patches/tinyusdz.patch also carried seven fixes for
# upstream defects found while loading a real Omniverse Kit export (WorldLobby.usdz, 1.6 GB):
# before them the stage composed to 10 prims and reported SUCCESS, after them to 2806 prims,
# 942 meshes, 141 materials, 348 textures. None of the seven applies any more. What became of
# each, checked in the new source rather than assumed:
#
#  * FIXED UPSTREAM, verbatim — the material:binding-with-no-target abort
#    (tydra/shader-network.cc now returns false there, with a comment stating the same
#    reasoning), the `st` primvar authored as float2[] (render-data-mesh.cc accepts
#    texCoord2f[] and the layout-identical float2[], with the same memcpy argument), and THE
#    texture defect: is_connection() has been replaced by has_connections() throughout
#    render-data-material.cc (22 sites), which is what made every material come back as flat
#    0.18 grey.
#
#  * NOW AN API OPTION, and therefore an ENGINE responsibility — the '..' asset path.
#    security-policy.hh gained `ValidateAndNormalizeAssetPath(path, out, allow_parent_refs)`
#    and composition.hh an `allow_parent_relative_paths` field. ⚠️ IT DEFAULTS TO FALSE in
#    all three option structs (composition.hh:81,104,157). A Kit-exported stage writes its
#    subLayers as "../Source/…", so the engine MUST set that option to true or the layers are
#    silently rejected again. Nothing in this build can set it for the consumer.
#
#  * ABSORBED BY A REWRITE, unverified here — the three composition defects (subLayers of a
#    referenced/payloaded layer never composed, arcs resolved in a single pass, arc prefix not
#    re-rooted). The engine is now a task-queue prim-index builder in a new file,
#    composition-graph.cc (PrimIndexBuilder / CompositionGraph), which structurally supersedes
#    them: arcs are re-scanned and re-enqueued as nodes are added, and SubLayer is a task type.
#    Structure is not measurement, though.
#
# ⚠️ COMPOSITION IS THEREFORE UNMEASURED ON THIS VERSION. The rule that produced those fixes
# still stands: this path is never trusted on a "no error", only on a prim/mesh/texture COUNT,
# because four of the seven defects failed silently or reported success. Re-run the reference
# asset before relying on it — see docs/todo/.
