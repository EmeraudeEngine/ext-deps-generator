name: reproc
source_dir: repositories/reproc
languages: [c, cxx]

cmake_options:
  # ⚠️ DEVIATION from the build policy (AGENTS.md § Build policy) — the C++ standard.
  # No CMAKE_CXX_STANDARD here on purpose: it would be inert. reproc sets
  # `CXX_STANDARD 11` as a target property for every target it creates
  # (cmake/reproc.cmake:111), which beats the cache variable — the C API is pinned to C99 the
  # same way. The reproc++ wrapper is a thin RAII layer over the C API, identical under both
  # standards. Verified in the generated build.ninja: -std=c++11 and -std=c99.
  REPROC++: true
  REPROC_MULTITHREADED: true
  REPROC_TEST: false
  REPROC_EXAMPLES: false
  REPROC_WARNINGS: false
  REPROC_TIDY: false
  REPROC_SANITIZERS: false
  REPROC_WARNINGS_AS_ERRORS: false
  REPROC_OBJECT_LIBRARIES: false
  REPROC_INSTALL: true
  REPROC_INSTALL_PKGCONFIG: true
  BUILD_SHARED_LIBS: false
  CMAKE_POSITION_INDEPENDENT_CODE: true
