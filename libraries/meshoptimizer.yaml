name: meshoptimizer
source_dir: repositories/meshoptimizer
languages: [cxx]

# Vertex/index buffer codec behind EXT_meshopt_compression. Pinned to the v1.2 RELEASE
# tag (owner rule: no release candidates).
#
# Why it exists: fastgltf PARSES the extension but never decodes it. It fills a
# `fastgltf::CompressedBufferView` (mode, filter, byteStride, count) per buffer view and
# validates the field ranges (src/fastgltf.cpp:1075), yet there is not a single
# `meshopt_decode*` call anywhere in the library. A GLB carrying the extension therefore
# feeds `iterateAccessor()` raw compressed bytes — silently, as noise rather than an
# error. Every meshopt buffer view must be decoded before any accessor is read.
#
# Only the DECODER is needed at runtime: `meshopt_decodeVertexBuffer` for
# MeshoptCompressionMode::Attributes, `meshopt_decodeIndexBuffer` for Triangles/Indices,
# then the matching inverse filter (`meshopt_decodeFilterOct` for octahedral normals and
# tangents, `meshopt_decodeFilterQuat`, `meshopt_decodeFilterExp`). The encoder rides in
# the same archive at no extra cost and the linker prunes it.

cmake_options:
  # Project build policy (AGENTS.md § Build policy): pin the standard, otherwise the build
  # takes the host compiler's default (gnu++17 on gcc 14 today, something else tomorrow) and
  # the archive's API can change with the build machine.
  CMAKE_CXX_STANDARD: 20
  CMAKE_CXX_STANDARD_REQUIRED: true
  BUILD_SHARED_LIBS: false
  MESHOPT_BUILD_SHARED_LIBS: false
  CMAKE_POSITION_INDEPENDENT_CODE: true

  # Consumer only: the demo pulls in a main(), gltfpack a whole CLI.
  MESHOPT_BUILD_DEMO: false
  MESHOPT_BUILD_GLTFPACK: false
  MESHOPT_INSTALL: true
  MESHOPT_WERROR: false
