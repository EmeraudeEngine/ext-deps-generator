name: lunasvg
source_dir: repositories/lunasvg
# Languages: lunasvg is C++, but its sub-library plutovg is C. Without the `cxx` entry the builder passes no CMAKE_CXX_FLAGS, so the C++
# sources missed the platform flags (-fPIC, -arch, the build-path remapping): until
# 2026-10-10 the Debug archive leaked the build machine's root in every assert().
languages: [c, cxx]

cmake_options:
  # ⚠️ DEVIATION from the build policy (AGENTS.md § Build policy) — the C++ standard.
  # No CMAKE_CXX_STANDARD here on purpose: it would be inert. Upstream sets the
  # `CXX_STANDARD 17` TARGET PROPERTY (CMakeLists.txt:57), which beats the cache variable,
  # so the archive is C++17 whatever the builder passes. Lifting it needs a patch; lunasvg's
  # API surface (Document, Bitmap) is the same under both standards. Verified in the
  # generated build.ninja: -std=gnu++17.
  BUILD_SHARED_LIBS: false
  LUNASVG_BUILD_EXAMPLES: false
  USE_SYSTEM_PLUTOVG: false